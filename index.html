<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>

  <style>
    :root {
      --background: #f5f7fb
;
      --surface: #ffffff
;
      --text: #202938
;
      --muted: #697386
;
      --primary: #4f46e5
;
      --primary-dark: #3730a3
;
      --border: #e2e8f0
;
      --success: #15803d
;
      --danger: #b91c1c
;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
    }

    .intro {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .tracker {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .progress-section {
      padding: 24px;
      border-bottom: 1px solid var(--border);
    }

    .progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .progress-label {
      font-weight: 700;
    }

    .progress-count {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e8eaf5
;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transition: width 180ms ease;
    }

    .task-list {
      list-style: none;
      margin: 0;
      padding: 8px 24px 16px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 68px;
      border-bottom: 1px solid var(--border);
    }

    .task-item:last-child {
      border-bottom: 0;
    }

    .task-checkbox {
      width: 21px;
      height: 21px;
      flex: 0 0 auto;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .task-label {
      flex: 1;
      padding: 18px 0;
      cursor: pointer;
      line-height: 1.4;
    }

    .task-item.is-complete .task-label {
      color: var(--muted);
      text-decoration: line-through;
    }

    .task-category {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eef2ff
;
      color: var(--primary-dark);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px;
      border-top: 1px solid var(--border);
    }

    .save-status {
      min-height: 20px;
      color: var(--success);
      font-size: 0.85rem;
    }

    .clear-button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: transparent;
      color: var(--danger);
      cursor: pointer;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .clear-button:hover,
    .clear-button:focus-visible {
      background: #fef2f2
;
    }

    .clear-button:focus-visible,
    .task-checkbox:focus-visible,
    .task-label:focus-visible {
      outline: 3px solid rgba(79, 70, 229, 0.3);
      outline-offset: 3px;
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      .progress-section,
      .footer {
        padding: 18px;
      }

      .task-list {
        padding-right: 18px;
        padding-left: 18px;
      }

      .task-category {
        display: none;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">Personal dashboard</p>
      <h1>Task Tracker</h1>
      <p class="intro">
        Track your progress. Your completed tasks are saved on this device.
      </p>
    </header>

    <section class="tracker" aria-labelledby="tracker-title">
      <h2 id="tracker-title" hidden>Task tracker</h2>

      <div class="progress-section">
        <div class="progress-top">
          <span class="progress-label">Progress</span>
          <span
            id="progressCount"
            class="progress-count"
            aria-live="polite"
          >
            0 of 0 completed
          </span>
        </div>

        <div
          class="progress-track"
          role="progressbar"
          aria-label="Task completion progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <ul id="taskList" class="task-list"></ul>

      <div class="footer">
        <span id="saveStatus" class="save-status" role="status"></span>

        <button id="clearButton" class="clear-button" type="button">
          Clear completed
        </button>
      </div>
    </section>
  </main>

  <script>
    (() => {

      const STORAGE_KEY = "canva-task-tracker-completions-v1";

      const tasks = [
        {
          id: "review-project-brief",
          title: "Review the project brief",
          category: "Planning"
        },
        {
          id: "complete-first-draft",
          title: "Complete the first draft",
          category: "Work"
        },
        {
          id: "check-design-details",
          title: "Check the design details",
          category: "Review"
        },
        {
          id: "submit-final-version",
          title: "Submit the final version",
          category: "Finish"
        }
      ];

      const taskList = document.getElementById("taskList");
      const progressBar = document.getElementById("progressBar");
      const progressCount = document.getElementById("progressCount");
      const saveStatus = document.getElementById("saveStatus");
      const clearButton = document.getElementById("clearButton");
      const progressTrack = document.querySelector(".progress-track");
      let completionState = loadCompletionState();

      function loadCompletionState() {
        try {
          const savedValue = window.localStorage.getItem(STORAGE_KEY);

          if (!savedValue) {
            return {};
          }

          const parsedValue = JSON.parse(savedValue);

          if (
            !parsedValue ||
            typeof parsedValue !== "object" ||
            Array.isArray(parsedValue)
          ) {
            return {};
          }


          return Object.fromEntries(
            Object.entries(parsedValue).filter(([taskId, isComplete]) => {
              return (
                tasks.some((task) => task.id === taskId) &&
                typeof isComplete === "boolean"
              );
            })
          );
        } catch (error) {

          console.warn("Task state could not be loaded.", error);
          return {};
        }
      }

      function saveCompletionState() {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(completionState)
          );

          showSaveStatus("Saved on this device.");
          return true;
        } catch (error) {

          console.warn("Task state could not be saved.", error);
          showSaveStatus("Saved for this visit.");
          return false;
        }
      }

      function showSaveStatus(message) {
        saveStatus.textContent = message;

        window.clearTimeout(showSaveStatus.timeoutId);

        showSaveStatus.timeoutId = window.setTimeout(() => {
          saveStatus.textContent = "";
        }, 2500);
      }

      function renderTasks() {
        taskList.replaceChildren();

        tasks.forEach((task) => {
          const isComplete = completionState[task.id] === true;

          const listItem = document.createElement("li");
          listItem.className = "task-item";
          listItem.dataset.taskId = task.id;

          if (isComplete) {
            listItem.classList.add("is-complete");
          }

          const checkbox = document.createElement("input");
          checkbox.className = "task-checkbox";
          checkbox.type = "checkbox";
          checkbox.checked = isComplete;
          checkbox.id = `task-${task.id}`;
          checkbox.setAttribute(
            "aria-label",
            `Mark "${task.title}" as complete`
          );

          const label = document.createElement("label");
          label.className = "task-label";
          label.htmlFor = checkbox.id;
          label.textContent = task.title;

          const category = document.createElement("span");
          category.className = "task-category";
          category.textContent = task.category;

          checkbox.addEventListener("change", () => {
            completionState[task.id] = checkbox.checked;

            listItem.classList.toggle("is-complete", checkbox.checked);

            updateProgress();
            saveCompletionState();
          });

          listItem.append(checkbox, label, category);
          taskList.appendChild(listItem);
        });

        updateProgress();
      }

      function updateProgress() {
        const completedCount = tasks.filter(
          (task) => completionState[task.id] === true
        ).length;

        const totalCount = tasks.length;
        const percentage =
          totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);

        progressBar.style.width = `${percentage}%`;
        progressCount.textContent = `${completedCount} of ${totalCount} completed`;

        progressTrack.setAttribute("aria-valuenow", String(percentage));
      }

      clearButton.addEventListener("click", () => {
        const hasCompletedTasks = tasks.some(
          (task) => completionState[task.id] === true
        );

        if (!hasCompletedTasks) {
          showSaveStatus("There are no completed tasks to clear.");
          return;
        }

        tasks.forEach((task) => {
          delete completionState[task.id];
        });

        saveCompletionState();
        renderTasks();
      });

      renderTasks();
    })();
  </script>
</body>
</html>

);

No fetch(), API endpoint, account session, or backend database is required. Each visitor gets a separate saved state in their own browser.
